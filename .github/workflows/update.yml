name: Update fuel prices

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a little late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch prices
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
          FUEL_FINDER_BASE: ${{ secrets.FUEL_FINDER_BASE }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          # Area to cover. Set REGION_RADIUS_MILES to 0 for the whole UK.
          CENTRE_LAT: "52.1360"
          CENTRE_LON: "-0.4667"
          REGION_RADIUS_MILES: "40"
        run: python fetch_prices.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
